<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Spotter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f1a;
            color: #ddd;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1rem 2rem;
            background: rgba(11, 15, 26, 0.9);
            border-bottom: 1px solid #1a2340;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.3rem;
            color: #fff;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #globe-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .info-panel {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 100;
            background: rgba(15, 20, 35, 0.85);
            border: 1px solid #1a2340;
            border-radius: 8px;
            padding: 1.2rem 1.5rem;
            min-width: 200px;
        }

        .info-panel h3 {
            font-size: 0.85rem;
            color: #7aa2d4;
            margin-bottom: 0.8rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            font-size: 0.85rem;
        }

        .info-row span:first-child {
            color: #888;
        }

        .info-row span:last-child {
            color: #fff;
            font-weight: 600;
        }

        footer {
            position: fixed;
            bottom: 0.5rem;
            right: 1.5rem;
            z-index: 100;
            font-size: 0.7rem;
            color: #444;
        }

        footer a { color: #5a8ab5; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>ISS Spotter</h1>
        <span style="font-size: 0.85rem; color: #aaa;">
            <span class="live-dot"></span> Live
        </span>
    </header>

    <div id="globe-container"></div>

    <div class="info-panel">
        <h3>Current Position</h3>
        <div class="info-row">
            <span>Latitude</span>
            <span id="lat">&mdash;</span>
        </div>
        <div class="info-row">
            <span>Longitude</span>
            <span id="lng">&mdash;</span>
        </div>
        <div class="info-row">
            <span>Updated</span>
            <span id="updated">&mdash;</span>
        </div>
        <div class="info-row">
            <span>Next refresh</span>
            <span id="countdown">&mdash;</span>
        </div>
        <div class="info-row">
            <span>Data points</span>
            <span id="datapoints">0</span>
        </div>
    </div>

    <footer>
        Data from <a href="http://open-notify.org/" target="_blank">Open Notify API</a>
    </footer>

    <script src="https://unpkg.com/globe.gl@2.33.0/dist/globe.gl.min.js"></script>
    <script>
        const globe = Globe()
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#3a7bd5')
            .atmosphereAltitude(0.2)
            .pointOfView({ lat: 20, lng: 0, altitude: 2.5 })
            .pointsData([])
            .pointLat('lat')
            .pointLng('lng')
            .pointColor(() => '#ff3333')
            .pointAltitude(0.05)
            .pointRadius(0.5)
            .pathsData([])
            .pathPoints('coords')
            .pathPointLat(p => p[0])
            .pathPointLng(p => p[1])
            .pathColor(() => ['rgba(100, 180, 255, 0.6)', 'rgba(100, 180, 255, 0.05)'])
            .pathStroke(1.5)
            .pathDashLength(0.05)
            .pathDashGap(0.01)
            .pathDashAnimateTime(100000)
            .ringsData([])
            .ringLat('lat')
            .ringLng('lng')
            .ringColor(() => t => `rgba(255, 50, 50, ${1 - t})`)
            .ringMaxRadius(2.5)
            .ringPropagationSpeed(2)
            .ringRepeatPeriod(1500)
            (document.getElementById('globe-container'));

        globe.width(window.innerWidth);
        globe.height(window.innerHeight);
        window.addEventListener('resize', () => {
            globe.width(window.innerWidth);
            globe.height(window.innerHeight);
        });

        globe.controls().autoRotate = false;
        globe.controls().autoRotateSpeed = 0.3;

        async function loadPosition() {
            try {
                const res = await fetch('/api/position');
                if (!res.ok) return;
                const data = await res.json();

                const lat = parseFloat(data.latitude);
                const lng = parseFloat(data.longitude);

                document.getElementById('lat').textContent = lat.toFixed(4) + '°';
                document.getElementById('lng').textContent = lng.toFixed(4) + '°';
                document.getElementById('updated').textContent = new Date(data.timestamp).toLocaleTimeString();

                globe.pointsData([{ lat, lng }]);
                globe.ringsData([{ lat, lng }]);
                globe.pointOfView({ lat, lng, altitude: 2.5 }, 2000);
            } catch (e) {
                console.error('Failed to load position:', e);
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                if (!res.ok) return;
                const history = await res.json();
                document.getElementById('datapoints').textContent = history.length;
                if (history.length > 1) {
                    const coords = history.map(p => [p.latitude, p.longitude]);
                    globe.pathsData([{ coords }]);
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        let secondsLeft = 60;
        setInterval(() => {
            const min = Math.floor(secondsLeft / 60);
            const sec = String(secondsLeft % 60).padStart(2, '0');
            document.getElementById('countdown').textContent = min + ':' + sec;
            if (secondsLeft <= 0) {
                secondsLeft = 60;
                loadPosition();
                loadHistory();
            } else {
                secondsLeft--;
            }
        }, 1000);

        loadPosition();
        loadHistory();
    </script>
</body>
</html>
