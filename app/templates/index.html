<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Spotter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e3a5f;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #64b5f6;
        }

        header h1 span {
            color: #90caf9;
            font-weight: 300;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #81c784;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #map {
            width: 100%;
            height: 55vh;
            min-height: 350px;
        }

        .info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1.5rem 2rem;
            background: #0d1b2a;
        }

        .info-card {
            background: #1b2838;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            border: 1px solid #1e3a5f;
        }

        .info-card .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #78909c;
            margin-bottom: 0.3rem;
        }

        .info-card .value {
            font-size: 1.35rem;
            font-weight: 600;
            color: #e3f2fd;
            font-variant-numeric: tabular-nums;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: #546e7a;
        }

        footer a { color: #64b5f7; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>ISS <span>Spotter</span></h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Live Tracking</span>
        </div>
    </header>

    <div id="map"></div>

    <div class="info-bar">
        <div class="info-card">
            <div class="label">Latitude</div>
            <div class="value" id="lat">—</div>
        </div>
        <div class="info-card">
            <div class="label">Longitude</div>
            <div class="value" id="lng">—</div>
        </div>
        <div class="info-card">
            <div class="label">Last Updated</div>
            <div class="value" id="updated">—</div>
        </div>
        <div class="info-card">
            <div class="label">Refresh</div>
            <div class="value" id="countdown">—</div>
        </div>
    </div>

    <footer>
        Data from <a href="http://open-notify.org/" target="_blank">Open Notify API</a>
        &middot; Updates every 5 minutes
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Map Setup
        const map = L.map('map', {
            center: [0, 0],
            zoom: 2,
            zoomControl: true,
            worldCopyJump: true
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 18
        }).addTo(map);

        // Custom ISS icon
        const issIcon = L.divIcon({
            html: `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#64b5f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" fill="#64b5f6" fill-opacity="0.3"/>
                <line x1="3" y1="12" x2="8" y2="12"/>
                <line x1="16" y1="12" x2="21" y2="12"/>
                <line x1="12" y1="3" x2="12" y2="8"/>
                <line x1="12" y1="16" x2="12" y2="21"/>
            </svg>`,
            className: '',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        let issMarker = L.marker([0, 0], { icon: issIcon }).addTo(map);
        let trailLine = L.polyline([], { color: '#64b5f6', weight: 2, opacity: 0.5 }).addTo(map);

        // Data Loading
        async function loadPosition() {
            try {
                const res = await fetch('/api/position');
                if (!res.ok) return;
                const data = await res.json();

                const lat = parseFloat(data.latitude).toFixed(4);
                const lng = parseFloat(data.longitude).toFixed(4);

                document.getElementById('lat').textContent = lat + '°';
                document.getElementById('lng').textContent = lng + '°';

                const dt = new Date(data.timestamp);
                document.getElementById('updated').textContent = dt.toLocaleTimeString();

                issMarker.setLatLng([data.latitude, data.longitude]);
                map.panTo([data.latitude, data.longitude], { animate: true, duration: 1 });
            } catch (e) {
                console.error('Failed to load position:', e);
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                if (!res.ok) return;
                const history = await res.json();
                const coords = history.map(p => [p.latitude, p.longitude]);
                trailLine.setLatLngs(coords);
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        // Countdown Timer
        let secondsLeft = 300;
        function tick() {
            const min = Math.floor(secondsLeft / 60);
            const sec = String(secondsLeft % 60).padStart(2, '0');
            document.getElementById('countdown').textContent = `${min}:${sec}`;
            if (secondsLeft <= 0) {
                secondsLeft = 300;
                loadPosition();
                loadHistory();
            } else {
                secondsLeft--;
            }
        }

        // Init
        loadPosition();
        loadHistory();
        setInterval(tick, 1000);
    </script>
</body>
</html>
